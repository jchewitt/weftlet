name: Storage qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/storage-qualification.yml'
      - 'scripts/storage-study/**'
      - 'tests/fixtures/traversal.ts'
      - 'examples/pipeline/**'
      - 'examples/generic-typescript/ontology/**'
      - 'src/storage/**'
      - 'src/application/hydrator.ts'
      - 'src/extraction/ontology*.ts'
      - 'src/extraction/static.ts'
      - 'src/extraction/compiler-workspace.ts'
      - 'src/infrastructure/compiler-docker.ts'
      - 'tests/fixtures/large-typescript-project.ts'
      - 'src/application/delivery/**'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            backend: rdf
          - os: windows-latest
            backend: rdf
          - os: ubuntu-latest
            backend: opencaesar
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.18.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Strict extraction, retention and native allocation
        env:
          WEFTLET_SNAPSHOT_FORMAT: brotli-v1
        run: node --import tsx scripts/storage-study/history-plateau.ts ${{ matrix.backend }} storage-qualification.json
      - name: Measured legacy index migration and historical snapshot delivery
        if: matrix.backend == 'rdf'
        run: node --import tsx scripts/storage-study/migration-delivery.ts storage-migration.json
      - name: Native full-volume publication on a disposable Linux tmpfs
        if: matrix.os == 'ubuntu-latest' && matrix.backend == 'rdf'
        run: bash scripts/storage-study/full-volume.sh > storage-capacity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storage-qualification-${{ matrix.os }}-${{ matrix.backend }}
          path: |
            storage-qualification.json
            storage-capacity.json
            storage-migration.json
          if-no-files-found: error
