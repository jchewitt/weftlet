name: Standalone checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
  windows-storage-and-startup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.18.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @weftlet/core test
      - name: Native Windows storage, launchers, source indexing, integrity and MCP startup
        run: pnpm exec vitest run tests/contract-compatibility.test.ts src/graph/constraint-comparison.test.ts src/interfaces/graph-compatibility.test.ts tests/contract-obligations.test.ts tests/static-calls.test.ts scripts/mapping-study/assessment.test.ts tests/document-symbol-bindings.test.ts src/extraction/symbol-selectors.test.ts tests/code-evidence.test.ts tests/code-evidence-rdf.test.ts src/extraction/scip-occurrences.test.ts src/storage/atomic-rename.test.ts src/storage/artifact-paths.test.ts src/repository/git.test.ts src/repository/git-entries.test.ts src/extraction/canonical-document-links.test.ts src/extraction/document-traversal.test.ts tests/document-coverage.test.ts src/interfaces/document-coverage.test.ts src/application/document-classification.test.ts src/extraction/document-classification.test.ts src/extraction/document-evidence.test.ts src/graph/document-roles.test.ts tests/document-source-rdf.test.ts tests/document-evidence.test.ts tests/traversal-hydration.test.ts tests/snapshot-lifecycle.test.ts tests/mcp-startup.test.ts src/extraction/codex-command.test.ts src/extraction/codex-auth.test.ts src/extraction/semantic-process.test.ts src/extraction/scip-project.test.ts src/extraction/document.test.ts src/extraction/repository-nodes.test.ts tests/semantic-identity.test.ts tests/shacl-validation.test.ts src/graph/identity-preflight.test.ts tests/identity-preflight.test.ts src/interfaces/identity-preflight.test.ts tests/hydration-plan.test.ts src/interfaces/hydration-plan.test.ts src/configuration/config.test.ts src/configuration/cache.test.ts tests/semantic-cache-reuse.test.ts tests/cache-adoption.test.ts src/interfaces/cache-adoption.test.ts tests/hydration-failure.test.ts tests/physical-file-kinds.test.ts tests/extractor-compatibility.test.ts src/governance/physical-file-kinds.test.ts src/interfaces/hydration-failure.test.ts src/extraction/providers.test.ts src/extraction/module-request.test.ts src/extraction/routing.test.ts tests/routing.test.ts src/graph/ranking.test.ts src/graph/query.test.ts src/graph/neighborhood.test.ts src/graph/path-search.test.ts src/graph/paths.test.ts src/interfaces/graph-paths.test.ts src/visualization/path-parity.test.ts src/interfaces/graph-exploration.test.ts tests/business-context-acceptance.test.ts src/graph/coverage.test.ts tests/implementation-coverage.test.ts src/application/overlay.test.ts scripts/inventory.test.ts scripts/release-documentation.test.ts scripts/evaluation/protocol.test.ts scripts/validation-benchmark/study.test.ts scripts/code-graph-study/check.test.ts scripts/code-graph-study/normalize.test.ts
      - name: Check repository extraction inventory on Windows
        run: pnpm inventory:check
      - name: Check generated license notices on Windows
        run: pnpm context-graph:licenses:check
