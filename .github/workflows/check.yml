name: Standalone checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./action
      - name: Sandboxed graph explorer browser interaction
        run: pnpm test:viewer:browser
        env:
          WEFTLET_BROWSER_EXECUTABLE: /usr/bin/google-chrome
          WEFTLET_BROWSER_SCREENSHOT: .context-graph/viewer-browser.png
      - name: Retain public-fixture viewer screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-viewer-browser
          path: .context-graph/viewer-browser.png
          if-no-files-found: ignore
  windows-storage-and-startup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.18.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @weftlet/core test
      - name: Optional compiler mount arguments and filesystem isolation
        run: pnpm exec vitest run tests/ontology-compiler.test.ts src/extraction/ontology.test.ts
      - name: Explorer HTTP service and shared discovery index
        run: pnpm exec vitest run tests/explorer-server.test.ts tests/explorer-export.test.ts src/graph/discovery.test.ts src/graph/snapshot-index.test.ts src/interfaces/graph-discovery.test.ts
      - name: Exact-owner intent retrieval, coverage and citation path portability
        run: pnpm exec vitest run tests/owner-intent.test.ts src/graph/owner-intent.test.ts
      - name: Canonical semantic file contract and immutable failure recovery
        run: pnpm exec vitest run tests/canonical-semantic-files.test.ts
      - name: Independent Claude and OpenCode provider lifecycles
        run: pnpm exec vitest run src/extraction/claude.test.ts tests/claude-consumer.test.ts src/extraction/opencode.test.ts tests/opencode-consumer.test.ts src/interfaces/init.test.ts
      - name: Project skill setup and preservation
        run: pnpm exec vitest run src/application/setup/skills.test.ts src/interfaces/setup.test.ts src/interfaces/init-interactive.test.ts
      - name: Native Windows storage, launchers, source indexing, integrity and MCP startup
        run: pnpm exec vitest run src/storage/streaming-json.test.ts tests/rdf-scaling-parity.test.ts tests/large-graph-lifecycle.test.ts tests/mapping-proposals.test.ts src/extraction/mapping-provider.test.ts src/interfaces/mapping-proposals.test.ts src/storage/mapping-proposals.test.ts tests/monorepo-coverage.test.ts src/extraction/code-inventory.test.ts src/interfaces/code-coverage.test.ts tests/contract-compatibility.test.ts src/graph/constraint-comparison.test.ts src/interfaces/graph-compatibility.test.ts tests/contract-obligations.test.ts tests/static-calls.test.ts scripts/mapping-study/assessment.test.ts tests/document-symbol-bindings.test.ts src/extraction/symbol-selectors.test.ts tests/code-evidence.test.ts tests/code-evidence-rdf.test.ts src/extraction/scip-occurrences.test.ts src/storage/atomic-rename.test.ts src/storage/artifact-paths.test.ts src/repository/git.test.ts src/repository/git-entries.test.ts src/extraction/canonical-document-links.test.ts src/extraction/document-traversal.test.ts tests/document-coverage.test.ts src/interfaces/document-coverage.test.ts src/application/document-classification.test.ts src/extraction/document-classification.test.ts src/extraction/document-evidence.test.ts src/graph/document-roles.test.ts tests/document-source-rdf.test.ts tests/document-evidence.test.ts tests/traversal-hydration.test.ts tests/snapshot-lifecycle.test.ts tests/mcp-startup.test.ts src/extraction/codex-command.test.ts src/extraction/codex-auth.test.ts src/extraction/semantic-process.test.ts src/extraction/scip-project.test.ts src/extraction/document.test.ts src/extraction/repository-nodes.test.ts tests/semantic-identity.test.ts tests/shacl-validation.test.ts src/graph/identity-preflight.test.ts tests/identity-preflight.test.ts src/interfaces/identity-preflight.test.ts tests/hydration-plan.test.ts src/interfaces/hydration-plan.test.ts src/configuration/config.test.ts src/configuration/cache.test.ts tests/semantic-cache-reuse.test.ts tests/cache-adoption.test.ts src/interfaces/cache-adoption.test.ts tests/hydration-failure.test.ts tests/physical-file-kinds.test.ts tests/extractor-compatibility.test.ts src/governance/physical-file-kinds.test.ts src/interfaces/hydration-failure.test.ts src/extraction/providers.test.ts src/extraction/module-request.test.ts src/extraction/routing.test.ts tests/routing.test.ts src/graph/ranking.test.ts src/graph/query.test.ts src/graph/neighborhood.test.ts src/graph/path-search.test.ts src/graph/paths.test.ts src/interfaces/graph-paths.test.ts src/visualization/path-parity.test.ts src/interfaces/graph-exploration.test.ts tests/business-context-acceptance.test.ts src/graph/coverage.test.ts tests/implementation-coverage.test.ts src/application/overlay.test.ts scripts/inventory.test.ts scripts/release-documentation.test.ts scripts/evaluation/protocol.test.ts scripts/validation-benchmark/study.test.ts scripts/code-graph-study/check.test.ts scripts/code-graph-study/normalize.test.ts
      - name: Check repository extraction inventory on Windows
        run: pnpm inventory:check
      - name: Check generated license notices on Windows
        run: pnpm context-graph:licenses:check
  windows-relationship-retrieval:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.18.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Real extraction and fixed-budget relationship retrieval
        run: pnpm exec vitest run tests/relationship-retrieval.test.ts tests/indirect-retrieval.test.ts tests/same-group-retrieval.test.ts src/graph/impact-order.test.ts src/graph/impact-affinity.test.ts
